# ==============================================================================
# NPM + GITHUB PACKAGES PUBLISH WORKFLOW SETUP INSTRUCTIONS
# ==============================================================================
# This workflow automatically builds and publishes the `saturon` library package
# to the NPM registry and to GitHub Packages (as `@ganemedelabs/saturon`)
# whenever the `version` in `packages/saturon/package.json` is updated on the
# `main` branch.
#
# SETUP INSTRUCTIONS:
#
# OPTION A: Trusted Publishing (Recommended - Passwordless & Tokenless)
# 1. Log in to https://www.npmjs.com
# 2. Go to package settings for `saturon` -> "Settings" -> "Trusted Publishers".
# 3. Click "Add Publisher" -> Select "GitHub Actions".
# 4. Fill in:
#    - Owner: ganemedelabs
#    - Repository: saturon
#    - Workflow filename: publish.yaml
# 5. Under "Allowed actions", check "Allow npm publish" (this workflow does a
#    direct publish, not staged publishing).
# 6. Save. Trusted Publishing uses OIDC to mint temporary tokens automatically.
#    Requires npm CLI >= 11.5.1 and Node >= 22.14.0 - this workflow uses Node 22
#    and force-updates npm to latest to guarantee that.
#
# OPTION B: NPM Secret Token (Legacy Method)
# 1. Generate an NPM Access Token at https://www.npmjs.com/settings/<your-user>/tokens
# 2. Go to your GitHub Repository -> Settings -> Secrets and variables -> Actions.
# 3. Add a new repository secret named `NPM_TOKEN`.
# 4. Uncomment the `NODE_AUTH_TOKEN` line under the "Publish Package (npm)" step below.
#
# GITHUB PACKAGES (no extra setup needed)
# - The built-in `GITHUB_TOKEN` is used to authenticate, so no secret is required.
#   The job only needs the `packages: write` permission (already set below).
# - GitHub Packages requires a scoped name, so the workflow renames the package
#   to `@ganemedelabs/saturon` on the runner only. The rename is never committed.
# - `packages/saturon/package.json` should have a `repository` field pointing at
#   https://github.com/ganemedelabs/saturon so the package is linked to this repo.
# - GitHub Packages does not support npm provenance, so `--provenance` is only
#   used for the npm publish.
# - Installing from GitHub Packages requires consumers to authenticate, e.g. add
#   `@ganemedelabs:registry=https://npm.pkg.github.com` to their `.npmrc`.
# ==============================================================================

name: Publish NPM Package

on:
    push:
        branches:
            - main

jobs:
    publish:
        runs-on: ubuntu-latest
        permissions:
            contents: read
            packages: write # Required to publish to GitHub Packages
            id-token: write # Required for passwordless NPM Trusted Publishing (OIDC)

        steps:
            - uses: actions/checkout@v7
              with:
                  fetch-depth: 0

            - name: Install pnpm
              uses: pnpm/action-setup@v6

            - name: Setup Node.js
              uses: actions/setup-node@v7
              with:
                  node-version: "22" # Trusted Publishing requires Node >= 22.14.0
                  registry-url: "https://registry.npmjs.org"
                  cache: "pnpm"

            - name: Ensure npm is new enough for Trusted Publishing
              run: |
                  npm install -g npm@latest
                  npm --version

            - name: Install dependencies
              run: pnpm install

            - name: Check the version
              id: check
              run: |
                  PACKAGE_NAME=$(jq -r .name packages/saturon/package.json)
                  CURRENT_VERSION=$(jq -r .version packages/saturon/package.json)
                  echo "Package name: $PACKAGE_NAME"
                  echo "Current version: $CURRENT_VERSION"

                  LATEST_VERSION=$(npm show "$PACKAGE_NAME" version 2>/dev/null || echo "0.0.0")
                  echo "Latest version: $LATEST_VERSION"

                  if [ "$LATEST_VERSION" != "$CURRENT_VERSION" ]; then
                    echo "Version changed"
                    echo "version_changed=true" >> $GITHUB_OUTPUT
                    echo "new_version=$CURRENT_VERSION" >> $GITHUB_OUTPUT
                  else
                    echo "Version not changed"
                    echo "version_changed=false" >> $GITHUB_OUTPUT
                  fi

            - name: Build Library
              if: steps.check.outputs.version_changed == 'true'
              run: pnpm --filter saturon build

            # ------------------------------------------------------------------
            # npmjs.com
            # ------------------------------------------------------------------
            - name: Publish Package (npm)
              if: steps.check.outputs.version_changed == 'true'
              run: pnpm --filter saturon publish --no-git-checks --provenance
              env:
                  # NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }} # (Uncomment if using Option B above)
                  NPM_CONFIG_PROVENANCE: true

            # ------------------------------------------------------------------
            # GitHub Packages
            # ------------------------------------------------------------------
            - name: Setup Node.js for GitHub Packages
              if: steps.check.outputs.version_changed == 'true'
              uses: actions/setup-node@v7
              with:
                  node-version: "22"
                  registry-url: "https://npm.pkg.github.com"
                  scope: "@ganemedelabs"

            - name: Scope the package name for GitHub Packages
              if: steps.check.outputs.version_changed == 'true'
              working-directory: packages/saturon
              run: npm pkg set name="@ganemedelabs/saturon"

            - name: Publish Package (GitHub Packages)
              if: steps.check.outputs.version_changed == 'true'
              working-directory: packages/saturon
              run: pnpm publish --no-git-checks
              env:
                  NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
