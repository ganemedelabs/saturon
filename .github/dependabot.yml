version: 2

updates:
    - package-ecosystem: "npm"
      directories:
          - "/"
          - "**/*"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 10
      groups:
          npm-minor-and-patch:
              patterns:
                  - "*"
              update-types:
                  - "minor"
                  - "patch"

    - package-ecosystem: "github-actions"
      directory: "/"
      schedule:
          interval: "weekly"
          day: "monday"
      open-pull-requests-limit: 5
      groups:
          github-actions:
              patterns:
                  - "*"
